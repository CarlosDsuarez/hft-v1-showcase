# Solo configuración de herramientas (no empaquetado).
# Dependencias: requirements-core.in/.txt (núcleo) y requirements.in/.txt (research).
[tool.ruff]
target-version = "py311"
extend-exclude = [".venv*", "research/__pycache__"]

[tool.ruff.lint]
# Solo errores reales, sin reglas de estilo/formato:
# E9 = sintaxis/IO, F63 = comparaciones inválidas, F7 = errores de sentencia,
# F82 = nombres no definidos.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: runner vivo end-to-end con fakes, sin red (tests/integration/; make test-integration)",
]
# NumPy >= 2.5 depreca la unidad 'generic' de timedelta (será error). Código propio:
# unidad explícita (tests/test_timedelta_units.py). pandas 3 ya no la emite en
# resample("ME"/"W"), así que no hay ignore.
filterwarnings = [
    "error:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
